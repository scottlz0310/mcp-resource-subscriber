name: Publish

on:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      recovery_tag:
        description: "復旧する draft のタグ（通常の検証では空欄）"
        required: false
        type: string
      recovery_sha:
        description: "復旧対象タグのコミット SHA（通常の検証では空欄）"
        required: false
        type: string

permissions:
  contents: read

concurrency:
  group: resource-bridge-release
  cancel-in-progress: false

jobs:
  dry-run:
    if: github.event_name == 'workflow_dispatch' && inputs.recovery_tag == '' && inputs.recovery_sha == ''
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
        with:
          run_install: false
      - uses: actions/setup-node@v7
        with:
          node-version: "26.13.0"
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm run check
      - run: pnpm run build
      - run: pnpm run typecheck
      - run: pnpm test

  draft:
    if: github.event_name == 'push' && startsWith(github.event.head_commit.message, 'chore(release):')
    uses: scottlz0310/release-automate/.github/workflows/reusable-publish-release.yml@3c860f1b178eb5b942d87c800153bc47887a7bfd # v3.2.1
    permissions:
      contents: write
    with:
      draft: true

  resolve:
    needs: draft
    # GitHub の draft 参照には push 権限が必要。
    permissions:
      contents: write
    if: always() && (needs.draft.result == 'success' || (github.event_name == 'workflow_dispatch' && github.ref == format('refs/heads/{0}', github.event.repository.default_branch) && (inputs.recovery_tag != '' || inputs.recovery_sha != '')))
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      tag_name: ${{ steps.select.outputs.tag_name }}
      target_sha: ${{ steps.select.outputs.target_sha }}
      release_state: ${{ steps.select.outputs.release_state }}
    steps:
      - uses: actions/checkout@v7
        if: github.event_name == 'workflow_dispatch'
        with:
          fetch-depth: 0
      - id: select
        env:
          EVENT_NAME: ${{ github.event_name }}
          DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
          REF_PROTECTED: ${{ github.ref_protected }}
          TAG: ${{ inputs.recovery_tag || needs.draft.outputs.tag_name }}
          TARGET_SHA: ${{ inputs.recovery_sha || needs.draft.outputs.target_sha }}
          RELEASE_STATE: ${{ needs.draft.outputs.release_state }}
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          if [[ "$EVENT_NAME" == 'workflow_dispatch' ]]; then
            bash scripts/validate-release-recovery.sh
            RELEASE_STATE=draft
          fi
          printf 'tag_name=%s\ntarget_sha=%s\nrelease_state=%s\n' "$TAG" "$TARGET_SHA" "$RELEASE_STATE" >> "$GITHUB_OUTPUT"

  publish:
    needs: resolve
    if: ${{ !cancelled() && needs.resolve.result == 'success' && needs.resolve.outputs.release_state == 'draft' }}
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ needs.resolve.outputs.target_sha }}
      - uses: pnpm/action-setup@v6
        with:
          run_install: false
      - uses: actions/setup-node@v7
        with:
          node-version: "26.13.0"
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm run check
      - run: pnpm run build
      - run: pnpm run typecheck
      - run: pnpm test
      - name: 配布 tarball と CLI の版を検証
        env:
          TAG: ${{ needs.resolve.outputs.tag_name }}
        run: |
          set -euo pipefail
          test "$(node -p "require('./package.json').version")" = "${TAG#v}"
          pnpm pack --pack-destination package-output
          packages=(package-output/*.tgz)
          test "${#packages[@]}" = 1
          tar -tzf "${packages[0]}" > package-files.txt
          grep -qx 'package/dist/src/client/cli.js' package-files.txt
          if grep -q '^package/dist/src/server/' package-files.txt; then
            echo '::error::fixture サーバーが公開 tarball に含まれています'
            exit 1
          fi
          mkdir packed
          tar xzf "${packages[0]}" -C packed
          ln -s "$GITHUB_WORKSPACE/node_modules" packed/package/node_modules
          test "$(node packed/package/dist/src/client/cli.js --version)" = "resource-bridge-cli $TAG"
      - uses: actions/upload-artifact@v7
        with:
          name: npm-payload
          path: package-output/*.tgz
          if-no-files-found: error
      - name: 同じ workflow から OIDC で npm 公開
        env:
          TAG: ${{ needs.resolve.outputs.tag_name }}
        run: |
          set -euo pipefail
          version=${TAG#v}
          args=(--provenance --access public)
          if [[ "${version%%+*}" == *-* ]]; then args+=(--tag next); fi
          packages=(./package-output/*.tgz)
          test "${#packages[@]}" = 1
          test -f "${packages[0]}"
          npm publish "${packages[0]}" "${args[@]}"

  verify-package:
    needs: [resolve, publish]
    if: ${{ !cancelled() && needs.resolve.result == 'success' && needs.publish.result == 'success' }}
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/setup-node@v7
        with:
          node-version: "26.13.0"
      - uses: actions/download-artifact@v8
        with:
          name: npm-payload
          path: expected
      - name: 公開 tarball の一致と provenance の存在を確認
        env:
          TAG: ${{ needs.resolve.outputs.tag_name }}
        run: |
          set -euo pipefail
          timeout 60 npm view "resource-bridge-cli@${TAG#v}" --json > metadata.json
          tarball=$(jq -er '.dist.tarball' metadata.json)
          jq -er '.dist.attestations.url' metadata.json
          curl -fSL --connect-timeout 10 --max-time 60 "$tarball" -o registry.tgz
          packages=(expected/*.tgz)
          test "${#packages[@]}" = 1
          cmp "${packages[0]}" registry.tgz

  finalize:
    needs: [resolve, publish, verify-package]
    if: ${{ !cancelled() && needs.resolve.result == 'success' && needs.publish.result == 'success' && needs.verify-package.result == 'success' }}
    uses: scottlz0310/release-automate/.github/workflows/reusable-finalize-release.yml@3c860f1b178eb5b942d87c800153bc47887a7bfd # v3.2.1
    permissions:
      contents: write
    with:
      tag_name: ${{ needs.resolve.outputs.tag_name }}
      target_sha: ${{ needs.resolve.outputs.target_sha }}
      resume: ${{ github.event_name == 'workflow_dispatch' }}
      append_release_evidence: true
      verification_results: ${{ toJSON(needs) }}
